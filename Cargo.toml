[workspace]
resolver = "2"
members = [
    "crates/poker-core",
    "crates/poker-analysis",
    "crates/poker-probability",
    "crates/poker-decision",
    "crates/poker-strategy",
    "crates/poker-simulation",
    "crates/poker-engine",
    "crates/poker-wasm",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
rand = "0.8"
criterion = { version = "0.4", features = ["html_reports"] }
proptest = "1.2"
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
wasm-bindgen-test = "0.3"
